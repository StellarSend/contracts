[workspace]
resolver = "2"
members = [
    "stellar_send",
    "fee_collector",
    "token_bridge",
    "escrow",
    "factory",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
